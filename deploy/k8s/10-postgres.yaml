# SPDX-License-Identifier: MIT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: docmost
  labels:
    app: docmost-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: docmost-db
  template:
    metadata:
      labels:
        app: docmost-db
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: docmost
            - name: POSTGRES_DB
              value: docmost
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docmost-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql
          # NOTE: kubernetes exec probes run the array directly - there is no
          # shell, so docker-compose's "CMD-SHELL" form does NOT work here.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "docmost", "-d", "docmost"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "docmost", "-d", "docmost"]
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: docmost-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: docmost
spec:
  selector:
    app: docmost-db
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docmost-db-data
  namespace: docmost
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
