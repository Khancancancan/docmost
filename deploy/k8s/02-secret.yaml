#
# WARNING: these values are for local/minikube testing only.
# On the work cluster replace them, e.g. with Sealed-Secrets / External-Secrets
# or at least `kubectl create secret generic docmost-secret --from-literal=...`.
apiVersion: v1
kind: Secret
metadata:
  name: docmost-secret
  namespace: docmost
type: Opaque
stringData:
  # At least 32 characters!
  APP_SECRET: "local-minikube-app-secret-change-me-00000001"
  POSTGRES_PASSWORD: "docmost"
  DATABASE_URL: "postgresql://docmost:docmost@db:5432/docmost"
